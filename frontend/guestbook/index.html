<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Guestbook - Megge" />
    <meta name="author" content="Megge" />

    <meta property="og:title" content="Guestbook - Megge" />
    <meta property="og:description" content="Guestbook - Megge" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://megge.me/" />
    <meta
      property="og:image"
      content="https://megge.me/assets/home/favicon/favicon_512px.png"
    />
    <meta property="og:site_name" content="Guestbook - Megge" />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/guestbook/favicon/favicon_16px.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/guestbook/favicon/favicon_32px.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="../assets/guestbook/favicon/favicon_48px.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/guestbook/favicon/favicon_180px.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="../assets/guestbook/favicon/favicon_512px.png"
    />

    <title>Guestbook - Megge</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="guestbook">
      <a href="/" class="back-button" aria-label="Back to home">← Back</a>
      <img
        id="logo"
        src="../assets/guestbook/logo.webp"
        alt=""
        aria-hidden="true"
      />
      <h1 class="title">Phan-Site</h1>

      <div id="entries-error" class="entries-error" hidden>
        <p role="status"></p>
        <button type="button">Retry</button>
      </div>
      <section id="entries" aria-label="Guestbook entries"></section>

      <nav id="pagination" aria-label="Pagination">
        <button id="prev" disabled>Previous Page</button>
        <span id="page-display" aria-live="polite" aria-atomic="true"
          >Page 1</span
        >
        <button id="next" disabled>Next Page</button>
      </nav>

      <div class="bottom-container">
        <form id="guestbook-form">
          <p id="form-header">Leave a Message</p>
          <div class="form-top-row">
            <div class="form-group">
              <label for="form-name">Name</label>
              <input
                id="form-name"
                name="name"
                type="text"
                maxlength="50"
                required
              />
            </div>

            <div class="form-group">
              <label>Avatar</label>
              <div id="avatar-carousel">
                <button
                  type="button"
                  id="avatar-prev"
                  aria-label="Previous Avatar"
                >
                  &lt;
                </button>
                <img
                  id="avatar-preview"
                  src="../assets/guestbook/chat_icons/phantom.webp"
                  alt="phantom"
                />
                <button type="button" id="avatar-next" aria-label="Next Avatar">
                  &gt;
                </button>
              </div>
              <input
                type="hidden"
                id="form-avatar"
                name="avatar"
                value="phantom"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="form-message">Message</label>
            <textarea
              id="form-message"
              name="message"
              maxlength="1000"
              required
            ></textarea>
          </div>

          <button type="submit" id="submit">Post Message</button>
          <p id="form-error" hidden>Something went wrong. Try again.</p>
        </form>

        <section id="phan-poll" aria-label="Phantom Thieves Poll">
          <div class="poll-question">
            <span class="poll-q">Q</span>
            <span class="poll-text"
              >Are the Phantom Thieves
              <span class="poll-just">JUST</span>?</span
            >
          </div>

          <div class="poll-bar-row">
            <div class="poll-bar">
              <div id="poll-bar-fill" style="width: 50%"></div>
            </div>
            <div class="poll-stats">
              <span class="poll-yes-label">YES</span>
              <span id="poll-pct">50.0%</span>
            </div>
          </div>

          <div class="poll-buttons">
            <button type="button" id="vote-yes">YES</button>
            <button type="button" id="vote-no">NO</button>
          </div>
          <p id="poll-msg" hidden></p>
        </section>
      </div>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
