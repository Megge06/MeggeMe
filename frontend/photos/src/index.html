---
layout: layouts/home
title: "Photos"
---

<img
  src="{{ '/assets/wii_menu.webp' | url }}"
  alt=""
  class="background-image"
/>
<a href="/" class="background-button-link">
  <img
    src="{{ '/assets/menu_button.webp' | url }}"
    alt="Back to main page"
    class="background-button"
  />
</a>

<div class="photos" id="photo-grid">
  {% for photo in photos %}
  <button
    class="photo-div"
    onclick="const photo = this.querySelector('img'); openLightbox(photo.src, photo.alt)"
  >
    <img
      class="photo"
      src="{{ photo.url | url | escape }}"
      alt="{{ photo.title | escape }}"
      loading="lazy"
    />
  </button>
  {% endfor %}
</div>

{% if photos.length > 6 %}
<nav class="photo-pages" aria-label="Photo pages" hidden>
  <button type="button" aria-label="Previous photo page" aria-controls="photo-grid">◀</button>
  <span aria-live="polite"></span>
  <button type="button" aria-label="Next photo page" aria-controls="photo-grid">▶</button>
</nav>
{% endif %}

<dialog
  id="lightbox"
  class="lightbox"
  onclick="if (event.target === this) this.close()"
  aria-label="Photo viewer"
>
  <button
    type="button"
    class="lightbox-close"
    onclick="this.closest('dialog').close()"
    aria-label="Close photo"
    autofocus
  >×</button>
  <img id="lightbox-img" class="lightbox-img" alt="" />
</dialog>

<div class="menu">
  <p id="time" class="time">Time</p>
  <p id="date">Date</p>
</div>

<script src="{{ '/script.js' | url }}"></script>
